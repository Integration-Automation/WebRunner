# The dev channel, je_web_runner_dev. The publish-dev job of .github/workflows/test_dev.yml builds it by
# writing this file to pyproject.toml (scripts/dev_release.py). The version below is a floor: CI publishes
# one patch above the newest release on PyPI and commits nothing back.
[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "je_web_runner_dev"
version = "0.0.99"
authors = [
    { name = "JE-Chen", email = "jechenmailman@gmail.com" },
]
description = "WEB Automation Framework"
requires-python = ">=3.10"
license-files = ["LICENSE"]
# Kept in step with pyproject.toml; see the rationale for each floor there.
dependencies = [
    "selenium>=4.0.0",
    "requests>=2.33.0",
    "python-dotenv>=1.0.0",
    "webdriver-manager>=4.0.0",
    "defusedxml>=0.7.1",
    "Pillow>=12.3.0",
    "je_action_core>=0.0.3",
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Operating System :: OS Independent"
]

# Optional: the WR_ac_* commands drive the desktop through AutoControl, which is imported
# only when one of them runs.
[project.optional-dependencies]
autocontrol = ["je_auto_control>=0.0.224"]

# Console scripts: the same entry point as ``python -m je_web_runner``.
[project.scripts]
webrunner = "je_web_runner.__main__:run"
web_runner = "je_web_runner.__main__:run"

[project.urls]
Homepage = "https://github.com/Integration-Automation/WebRunner"
Documentation = "https://webrunner.readthedocs.io/en/latest/"
Code = "https://github.com/Integration-Automation/WebRunner"

[project.readme]
file = "README.md"
content-type = "text/markdown"


[tool.setuptools.packages]
find = { namespaces = false }

[tool.setuptools.package-data]
# Ship the PEP 561 marker, as the stable package does.
je_web_runner = ["py.typed"]
